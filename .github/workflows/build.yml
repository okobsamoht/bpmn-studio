name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build:prod

      - name: Verify dist
        shell: bash
        run: |
          test -f dist/main/main.js   || (echo "missing dist/main/main.js" && exit 1)
          test -f dist/main/preload.js || (echo "missing dist/main/preload.js" && exit 1)
          test -f dist/renderer/renderer.js || (echo "missing dist/renderer/renderer.js" && exit 1)
          echo "Build artifacts OK"
